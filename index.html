    />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->

      property="og:description"
      content="Premier collection of fluid, physics-based React components crafted with Tailwind CSS and Framer Motion. Zero setup friction, 60 FPS motion, fully customizable."

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NeedUI Component Library Preview" />

      content="Premier collection of fluid, physics-based React components crafted with Tailwind CSS and Framer Motion. Copy-paste ready for modern web apps."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/png" href="/logo-dark-square-bg.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NeedUI",
        "url": "https://needui.dev",
        "description": "Customizable, accessible, animated React UI Component Library powered by Tailwind CSS & Framer Motion.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "NeedUI Team"
        }
      }
    </script>
<script>
  (function() {
    try {
      // SESUAIKAN KEY INI dengan yang dipakai di ThemeProvider.tsx Anda
      var themeKey = 'ui-theme'; 
      var localTheme = localStorage.getItem(themeKey);
      var sysTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (localTheme === 'dark' || (!localTheme && sysTheme)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <div id="root"></div>
