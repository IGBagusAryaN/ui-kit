<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@bgsaryzzz/ui - Component Library & Documentation</title>
<script>
  (function() {
    try {
      // SESUAIKAN KEY INI dengan yang dipakai di ThemeProvider.tsx Anda
      var themeKey = 'ui-theme'; 
      var localTheme = localStorage.getItem(themeKey);
      var sysTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (localTheme === 'dark' || (!localTheme && sysTheme)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-neutral-900 antialiased selection:bg-blue-500/20 selection:text-blue-700 dark:bg-neutral-950 dark:text-neutral-100 dark:selection:bg-blue-500/30 dark:selection:text-blue-300">
    <div id="root"></div>
    <script type="module" src="/playground/main.tsx"></script>
  </body>
</html>
